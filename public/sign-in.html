<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>إنشاء حساب - JOHN STORE</title>
  <link rel="icon" href="https://i.postimg.cc/x8xtX2KR/john-store.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/sign-in.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-badge">
          <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">JOHN <span>STORE</span></span>
          <span class="logo-sub">PUBG UC</span>
        </div>
      </a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        <h1>إنشاء حساب جديد</h1>
        <p>سجل بياناتك وابدأ الشحن في دقائق</p>
      </div>

      <div class="auth-alert" id="authAlert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="authAlertText"></span>
      </div>

      <form id="signUpForm" novalidate>

        <div class="auth-field">
          <label><i class="fas fa-user"></i> الاسم</label>
          <input type="text" id="signUpName" placeholder="اسمك داخل المتجر" required maxlength="40" autocomplete="name" />
          <small class="field-hint" id="nameHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="signUpEmail" placeholder="أدخل بريدك الإلكتروني" required autocomplete="email" />
          <small class="field-hint" id="emailHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-id-card"></i> ID المسجل في اللعبة</label>
          <input type="text" id="signUpId" placeholder="أدخل ID حسابك في اللعبة" required />
          <small class="field-hint" id="idHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-lock"></i> كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="signUpPassword" placeholder="اختر كلمة مرور قوية" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar"><span id="strengthBar"></span></div>
            <div class="strength-text" id="strengthText">قوة كلمة المرور: —</div>
          </div>

          <ul class="password-rules" id="passwordRules">
            <li data-rule="length"><i class="fas fa-circle"></i> 8 أحرف على الأقل</li>
            <li data-rule="upper"><i class="fas fa-circle"></i> حرف كبير (A-Z)</li>
            <li data-rule="lower"><i class="fas fa-circle"></i> حرف صغير (a-z)</li>
            <li data-rule="number"><i class="fas fa-circle"></i> رقم (0-9)</li>
            <li data-rule="symbol"><i class="fas fa-circle"></i> رمز خاص (@#$...)</li>
          </ul>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="signUpPasswordConfirm" placeholder="أعد كتابة كلمة المرور" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePasswordConfirm" aria-label="إظهار كلمة المرور">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <small class="field-hint" id="confirmHint"></small>
        </div>

        <button type="submit" class="auth-btn" id="signUpBtn">
          <i class="fas fa-user-plus"></i>
          <span>إنشاء الحساب</span>
        </button>
      </form>

      <div class="auth-links">
        عندك حساب بالفعل؟ <a href="/log-in">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="js/sign-in.js"></script>
</body>
</html>
