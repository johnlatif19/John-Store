<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>حسابي - JOHN STORE</title>
  <link rel="icon" href="https://i.postimg.cc/x8xtX2KR/john-store.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-badge">
          <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">JOHN <span>STORE</span></span>
          <span class="logo-sub">PUBG UC</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/" class="header-btn"><i class="fas fa-store"></i> المتجر</a>
        <button class="header-btn danger" onclick="userLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
      </div>
    </div>
  </header>

  <div class="account-container" id="accountContainer">

    <div class="account-loading" id="accountLoading">
      <span class="spinner"></span>
      <p>جاري تحميل بيانات الحساب...</p>
    </div>

    <div class="account-content" id="accountContent" style="display:none;">

      <div class="account-hero">
        <div class="account-avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="account-info">
          <h1 id="accName">—</h1>
          <p id="accEmail">—</p>
          <div class="acc-id-badge">
            <span>ID الأساسي</span>
            <strong id="accBaseId">—</strong>
            <button class="copy-btn" onclick="copyBaseId()" title="نسخ"><i class="fas fa-copy"></i></button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchAccTab('orders', this)"><i class="fas fa-shopping-bag"></i> الشحنات</button>
        <button class="tab-btn" onclick="switchAccTab('screens', this)"><i class="fas fa-image"></i> السكرينات</button>
      </div>

      <div class="tab-content active" id="accTab-orders">
        <div class="orders-summary" id="ordersSummary"></div>
        <div class="orders-list" id="ordersList"></div>
      </div>

      <div class="tab-content" id="accTab-screens">
        <div class="screens-grid" id="screensGrid"></div>
      </div>

    </div>

  </div>

  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <div class="image-modal-content">
      <button class="close-image-modal" onclick="closeImageModal()">&times;</button>
      <img id="modalImage" src="" alt="معاينة">
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/account.js"></script>
</body>
</html>
