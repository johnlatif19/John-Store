<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور - JOHN STORE</title>
  <link rel="icon" href="https://i.postimg.cc/x8xtX2KR/john-store.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/log-in.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-badge"><img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE"></div>
        <div class="logo-text-wrap">
          <span class="logo-text">JOHN <span>STORE</span></span>
          <span class="logo-sub">PUBG UC</span>
        </div>
      </a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        <h1>استعادة كلمة المرور</h1>
        <p>أدخل بريدك الإلكتروني لاستلام كود التحقق</p>
      </div>

      <div class="auth-alert" id="authAlert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="authAlertText"></span>
      </div>

      <!-- Step 1: Email -->
      <form id="emailStep" novalidate>
        <div class="auth-field">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="resetEmail" placeholder="example@domain.com" required autocomplete="email" />
          <small class="field-hint" id="emailHint"></small>
        </div>
        <button type="submit" class="auth-btn" id="sendOtpBtn">
          <i class="fas fa-paper-plane"></i> <span>إرسال الكود</span>
        </button>
      </form>

      <!-- Step 2: OTP + new password -->
      <form id="otpStep" style="display:none" novalidate>
        <div class="auth-field">
          <label><i class="fas fa-key"></i> كود التحقق (6 أرقام)</label>
          <input type="text" id="otpInput" inputmode="numeric" maxlength="6" placeholder="______" style="letter-spacing:8px;text-align:center;font-size:1.2rem;font-weight:700;" />
          <small class="field-hint" id="otpHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-lock"></i> كلمة المرور الجديدة</label>
          <div class="password-wrap">
            <input type="password" id="newPassword" placeholder="8 أحرف على الأقل" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePass1"><i class="fas fa-eye"></i></button>
          </div>
          <small class="field-hint" id="newPassHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePass2"><i class="fas fa-eye"></i></button>
          </div>
          <small class="field-hint" id="confirmPassHint"></small>
        </div>

        <div class="remember-row" style="justify-content:space-between;align-items:center;">
          <span style="font-size:.85rem;color:var(--text-dim)">الوقت المتبقي:</span>
          <span id="timer" style="font-family:'Chakra Petch',monospace;color:var(--primary);font-weight:700;font-size:1.05rem;">02:00</span>
        </div>

        <button type="submit" class="auth-btn" id="resetBtn">
          <i class="fas fa-check"></i> <span>تغيير كلمة المرور</span>
        </button>

        <button type="button" class="auth-btn" id="resendBtn" style="background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;margin-top:10px;">
          <i class="fas fa-rotate-right"></i> <span>إعادة إرسال الكود</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="/log-in"><i class="fas fa-arrow-right"></i> العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
