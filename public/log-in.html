<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تسجيل الدخول - JOHN STORE</title>
  <link rel="icon" href="https://i.postimg.cc/x8xtX2KR/john-store.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/log-in.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-badge">
          <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">JOHN <span>STORE</span></span>
          <span class="logo-sub">PUBG UC</span>
        </div>
      </a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="https://i.postimg.cc/x8xtX2KR/john-store.png" alt="JOHN STORE">
        <h1>تسجيل الدخول</h1>
        <p>ادخل إلى حسابك لمتابعة شحناتك</p>
      </div>

      <div class="auth-alert" id="authAlert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="authAlertText"></span>
      </div>

      <form id="logInForm" novalidate>

        <div class="auth-field">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
          <input type="email" id="logInEmail" placeholder="example@domain.com" required autocomplete="email" />
          <small class="field-hint" id="emailHint"></small>
        </div>

        <div class="auth-field">
          <label><i class="fas fa-lock"></i> كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="logInPassword" placeholder="أدخل كلمة المرور" required autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <small class="field-hint" id="passwordHint"></small>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>تذكرني على هذا الجهاز</span>
          </label>
        </div>

        <button type="submit" class="auth-btn" id="logInBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>دخول</span>
        </button>
      </form>

      <div class="auth-links">
        ما عندك حساب؟ <a href="/sign-in">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <script src="js/log-in.js"></script>
</body>
</html>
